; Helmet Cam: values the mod ships with. The "Reset to defaults" button on the Modloader screen reloads these.
; The player's own values live in the loader's settings folder (settings.ini), never here.
[helmet_cam]
; Key: a virtual-key code (0x48 = H; T is the game's troop-list key)
key=0x48
; Camera: field of view in degrees (30-120), and offsets in metres from the head position: forward along the gaze
; (-0.5 to 1) and up (-0.5 to 0.5). The head is 1.58 m above the feet standing, 1.14 m crouched.
fov=90
offset_forward=0.10
offset_up=0.00
; Debug: 0 helmet view, 1 mirror of the main view in the corner, 2 solid color
test_picture=0
; Milliseconds the key is held to open or close the cam; a shorter press cycles the operator
hold_ms=250
; Picture: anchor corner (0 top right, 1 top left, 2 bottom left, 3 bottom right), pixels in from that corner,
; width as a percentage of the window width (10-60)
anchor=0
offset_x=16
offset_y=16
size_percent=25
; Spike: log every human once a second (position, health, head bone) to dk2ml.log
log_operators=0
; Skip the camera pan-out at the end of a mission or replay. -1: leave the game's own setting alone
disable_end_camera_pan=-1
