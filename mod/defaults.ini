; Helmet Cam: values the mod ships with. The "Reset to defaults" button on the Modloader screen reloads these.
; The player's own values live in the loader's settings folder (settings.ini), never here.
[helmet_cam]
; Key: a virtual-key code (0x48 = H; T is the game's troop-list key)
key=0x48
; Camera: field of view in degrees (30-90), and offsets in metres from the head position: forward along the gaze
; (-0.5 to 1) and up (-0.5 to 0.5). The head is 1.58 m above the feet standing, 1.14 m crouched.
fov=45
offset_forward=0.15
offset_up=0.00
; Debug: 0 helmet view, 1 mirror of the main view in the corner, 2 solid color
test_picture=0
; Milliseconds the key is held to open or close the cam; a shorter press cycles the operator (not shown in game)
hold_ms=250
; Selection switching: 0 a tap of the key switches to the selected operator, 1 the cam follows the selection at once
selection_mode=1
; Action cam timing in milliseconds (game time): the cooldown after an action switch, how long the cam stays on its
; operator after their last shot or sighting, and how long an aim is held on a seen enemy before it counts
cooldown_ms=650
engage_hold_ms=900
aim_settle_ms=400
; Picture: anchor corner (0 top right, 1 top left, 2 bottom left, 3 bottom right), pixels in from that corner,
; width as a percentage of the window width (10-60)
anchor=0
offset_x=16
offset_y=16
size_percent=25
; Enemies, civilians and hostages can have helmet cams too (0 off, 1 on); no night-vision overlay in the picture (0 off, 1 on)
allow_all_humans=0
hide_night_vision=0
; How often the helmet view is re-rendered (the cost of this mod): 0 every frame, 1 60 fps, 2 30 fps, 3 15 fps
refresh_rate=2
; Spike: log every human once a second (position, health, head bone) to dk2ml.log
log_operators=0
